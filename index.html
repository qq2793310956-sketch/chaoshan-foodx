<body>

['戈饭','主食','🍛','lunch','米饭,家常,芋头','芋头腊肉香菇与米饭同煮，开锅香气四溢。'],
['猪排','家常菜','🍖','lunch','猪肉,煎炸,家常','大块猪排腌制入味后煎至两面金黄，外酥里嫩。'],
['小酥肉','家常菜','🥩','snack','猪肉,煎炸,小吃','猪肉条裹薄面糊炸至金黄酥脆，外酥里嫩咸香可口。'],
['可乐鸡翅','家常菜','🍗','lunch','鸡肉,可乐,家常','鸡翅用可乐酱油炖煮，甜咸交织色泽红亮。'],
['青椒炒肉','家常菜','🫑','lunch','猪肉,辣椒,家常','猪肉片与青椒爆炒，肉嫩椒香镬气十足。'],
['炒花甲','海鲜','🐚','dinner','贝壳,小炒,下酒','花甲吐沙后加蒜蓉辣椒爆炒，壳开肉嫩鲜美多汁。'],
['蒜香螃蟹','海鲜','🦀','dinner','螃蟹,蒜香,宴客','螃蟹斩件加大量蒜蓉爆炒，蒜香四溢蟹肉鲜甜。'],
['茄子煲','家常菜','🍆','lunch','蔬菜,家常,下饭','茄子过油入砂锅焖煮，加肉末酱汁，软糯入味。'],
['苦瓜炒蛋','家常菜','🥒','lunch','鸡蛋,苦瓜,家常','苦瓜切薄片与鸡蛋同炒，苦中回甘蛋香浓郁。'],
['西红柿炒蛋','家常菜','🍅','lunch','鸡蛋,番茄,家常,快手','番茄酸甜与鸡蛋嫩滑完美融合，简单快手百吃不厌。'],
['炒莲藕','家常菜','🪷','lunch','蔬菜,家常,清爽','莲藕切片清炒，脆嫩爽口清甜回甘。'],
['红烧排骨','家常菜','🍖','dinner','猪肉,红烧,硬菜','排骨加酱油糖色慢炖，肉质酥烂酱香浓郁。'],
['炸鸡翅','小吃','🍗','snack','鸡肉,煎炸,小吃','鸡翅腌制裹粉油炸至金黄酥脆，外皮香脆内里多汁。'],
['炒空心菜','家常菜','🥬','lunch','蔬菜,家常,快手','空心菜摘段猛火快炒加蒜末，碧绿脆嫩蒜香扑鼻。'],
['鲍鱼汤','汤品','🥣','dinner','海鲜,滋补,高档','鲜活鲍鱼与鸡肉瑶柱等同炖，汤色清澈鲜味醇厚。'],
['玉米排骨汤','汤品','🌽','dinner','排骨,玉米,滋补','排骨与甜玉米慢火熬煮，汤色乳白玉米清甜。'],
['虫草花鸡肉汤','汤品','🍄','dinner','鸡肉,滋补,药膳','虫草花与土鸡同炖，金黄澄澈菌香四溢。'],
['竹笋汤','汤品','🎋','lunch','竹笋,清淡,汤','鲜竹笋切片与排骨煲汤，清甜鲜嫩笋香馥郁。'],
['竹笋炒肉','家常菜','🎋','lunch','竹笋,猪肉,家常','鲜嫩竹笋与猪肉片爆炒，笋脆肉嫩清爽鲜香。'],
['小番茄','小吃','🍅','snack','水果,清爽,零食','新鲜小番茄洗净即食，酸甜多汁清爽解腻。'],
['杏鲍菇炒牛肉','家常菜','🍄','dinner','牛肉,菌菇,下饭','杏鲍菇切条与嫩牛肉片同炒，菇肉弹牙牛肉嫩滑。'],
['湿炒牛肉','家常菜','🥩','lunch','牛肉,湿炒,潮汕','牛肉片滑嫩多汁勾薄芡，配芥兰或青椒拌饭一绝。'],
['炒粉','主食','🍝','lunch','粉面,家常,快手','米粉河粉加鸡蛋豆芽肉丝猛火快炒，干香入味。'],
['炒饭','主食','🍚','lunch','米饭,家常,快手','隔夜米饭加鸡蛋火腿虾仁炒制，粒粒分明香浓可口。']
];

// 把RAW转成dishes对象
var D=[];
for(var i=0;i<RAW.length;i++){
  var a=RAW[i];
  D.push({id:i+1,n:a[0],c:a[1],e:a[2],m:a[3],tg:a[4],d:a[5]});
}
document.getElementById('dbg').textContent=D.length+'道菜已载入';

var ML={breakfast:'🌅 早餐',lunch:'☀️ 午餐',dinner:'🌙 晚餐',snack:'🍪 小吃点心'};
var meals=['breakfast','lunch','dinner','snack'];
var colors=['#FFB347','#E85D3F','#6B7BD0','#5CB85C'];

// 简单哈希
function H(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}

// 每日推荐
function daily(){
  var t=new Date();t.setDate(t.getDate()+1);
  var ds=t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();
  var seed=H(ds);

  // 按餐次分桶
  var bm={};meals.forEach(function(m){bm[m]=[];});
  D.forEach(function(d){bm[d.m].push(d);});

  // 从每个桶里根据seed取一道菜
  var used={},o={};
  meals.forEach(function(m,i){
    var pool=bm[m];
    var idx=(seed+i*7+Math.floor(seed/(i+1)))%pool.length;
    var pick=null;
    // 尝试找没用过的
    for(var k=0;k<pool.length;k++){
      var candidate=pool[(idx+k)%pool.length];
      if(!used[candidate.id]){pick=candidate;break;}
    }
    if(!pick)pick=pool[idx];
    used[pick.id]=1;o[m]=pick;
  });

  // 主打星
  var rest=[];
  D.forEach(function(d){if(!used[d.id])rest.push(d);});
  o.star=rest[(seed*13)%rest.length];
  return o;
}

var cr=daily();

// 渲染
var h='';
meals.forEach(function(m,i){
  var d=cr[m];
  if(!d){
    h+='<div class="cd"><div class="rw"><span class="em">❓</span><div><div class="nm">BUG: '+m+' 无数据</div></div></div></div>';
    return;
  }
  h+='<div class="cd" style="border-left:4px solid '+colors[i]+'">';
  h+='<div class="lb">'+ML[m]+'</div>';
  h+='<div class="rw"><span class="em">'+d.e+'</span><div style="flex:1"><div class="nm">'+d.n+'</div><div class="ct">'+d.c+'</div></div></div>';
  h+='<div class="dc">'+d.d+'</div>';
  h+='<div class="tg">';
  var tags=d.tg.split(',');
  for(var j=0;j<tags.length;j++){h+='<span>'+tags[j]+'</span>';}
  h+='</div></div>';
});
document.getElementById('cards').innerHTML=h;

// 主打星
var s=cr.star;
document.getElementById('star').innerHTML='<div class="sr"><span class="em">'+s.e+'</span><div style="flex:1"><div class="nm">'+s.n+'</div><div class="ct">'+s.c+'</div><div style="font-size:12px;color:#888">'+s.d+'</div></div><span style="font-size:24px;color:#CCC;">›</span></div>';
</script>
