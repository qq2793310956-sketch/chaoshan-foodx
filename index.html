['小番茄','小吃','🍅','snack','水果,清爽,零食','新鲜小番茄洗净即食，酸甜多汁清爽解腻。'],

var CS=[{n:'全部',e:'🔥'},{n:'粿类',e:'🥟'},{n:'海鲜',e:'🦀'},{n:'卤味',e:'🍖'},{n:'家常菜',e:'🏠'},{n:'汤品',e:'🍲'},{n:'小炒',e:'🥬'},{n:'甜点',e:'🍯'},{n:'小吃',e:'🥐'},{n:'主食',e:'🍚'}];

// 哈希
function H(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}

// 推荐
function daily(){
  var t=new Date();t.setDate(t.getDate()+1);
  var ds=t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();
  var seed=H(ds);
  var bm={};meals.forEach(function(m){bm[m]=[];});
  D.forEach(function(d){bm[d.m].push(d);});
  var used={},o={};
  meals.forEach(function(m,i){
    var pool=bm[m];
    var idx=(seed+i*7+Math.floor(seed/(i+1)))%pool.length;
    var pick=null;
    for(var k=0;k<pool.length;k++){var c=pool[(idx+k)%pool.length];if(!used[c.id]){pick=c;break;}}
    if(!pick)pick=pool[idx];
    used[pick.id]=1;o[m]=pick;
  });
  var rest=[];D.forEach(function(d){if(!used[d.id])rest.push(d);});
  o.star=rest[(seed*13)%rest.length];
  return o;
}
var cr=daily();

function rdr(data){
  if(data)cr=data;else cr=daily();
  var h='';
  meals.forEach(function(m,i){
    var d=cr[m];
    if(!d){h+='<div class="cd"><div class="rw"><span class="em">❓</span><div><div class="nm">错误</div></div></div></div>';return;}
    h+='<div class="cd" style="border-left:4px solid '+colors[i]+'" onclick="det('+d.id+')">';
    h+='<div class="lb">'+ML[m]+'</div>';
    h+='<div class="rw"><span class="em">'+d.e+'</span><div style="flex:1"><div class="nm">'+d.n+'</div><div class="ct">'+d.c+'</div></div></div>';
    h+='<div class="dc">'+d.d+'</div><div class="tg">';
    var tags=d.tg.split(',');
    for(var j=0;j<tags.length;j++){h+='<span>'+tags[j]+'</span>';}
    h+='</div></div>';
  });
  document.getElementById('cards').innerHTML=h;
  var s=cr.star;
  document.getElementById('star').innerHTML='<div class="sr" onclick="det('+s.id+')"><span class="em">'+s.e+'</span><div style="flex:1"><div class="nm">'+s.n+'</div><div class="ct">'+s.c+'</div><div style="font-size:12px;color:#888">'+s.d+'</div></div><span style="font-size:24px;color:#CCC;">›</span></div>';
}

rdr();

function rnd(){
  // 纯随机洗牌，不基于日期
  var arr=D.slice().sort(function(){return Math.random()-0.5;});
  var bm={};meals.forEach(function(m){bm[m]=[];});
  arr.forEach(function(d){if(bm[d.m].length<1)bm[d.m].push(d);});
  var used={};cr={};
  meals.forEach(function(m){
    var pick=bm[m][0];
    if(!pick){for(var k=0;k<arr.length;k++){if(arr[k].m===m&&!used[arr[k].id]){pick=arr[k];break;}}}
    if(!pick)pick=arr[0];
    used[pick.id]=1;cr[m]=pick;
  });
  for(var i=0;i<arr.length;i++){if(!used[arr[i].id]){cr.star=arr[i];break;}}
  if(!cr.star)cr.star=arr[0];
  rdr(cr);
  var t=document.createElement('div');
  t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#FFF;padding:10px 24px;border-radius:10px;font-size:14px;z-index:999;pointer-events:none';
  t.textContent='已刷新✨';document.body.appendChild(t);
  setTimeout(function(){t.remove();},1500);
}

// 详情
function det(id){
  var d=null;for(var i=0;i<D.length;i++){if(D[i].id===id){d=D[i];break;}}if(!d)return;
  document.getElementById('mdl').className='mdl on';
  var h='<button class="cl" onclick="cls()">✕</button>';
  h+='<span style="font-size:80px;text-align:center;display:block;margin-bottom:8px">'+d.e+'</span>';
  h+='<h3 style="font-size:24px;text-align:center;margin-bottom:4px">'+d.n+'</h3>';
  h+='<div style="display:flex;justify-content:center;gap:8px;margin-bottom:14px"><span style="padding:3px 14px;border-radius:14px;font-size:12px;background:#FFF0EC;color:#E85D3F">'+d.c+'</span><span style="padding:3px 14px;border-radius:14px;font-size:12px;background:#F5F5F5;color:#666">'+ML[d.m]+'</span></div>';
  h+='<div style="font-size:14px;color:#555;line-height:1.7;margin-bottom:12px">'+d.d+'</div>';
  h+='<div style="font-size:12px;font-weight:600;color:#888;margin-bottom:4px">🏷️ 标签</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  var tags=d.tg.split(',');
  for(var j=0;j<tags.length;j++){h+='<span style="font-size:11px;color:#E85D3F;background:rgba(232,93,63,.06);padding:3px 12px;border-radius:12px;border:1px solid rgba(232,93,63,.1)">'+tags[j]+'</span>';}
  h+='</div><div style="font-size:12px;font-weight:600;color:#888;margin-bottom:4px">🍵 搭配建议</div>';
  h+='<div style="font-size:13px;color:#666;margin-bottom:4px">🍵 配一壶功夫茶，解腻回甘</div>';
  h+='<div style="font-size:13px;color:#666;margin-bottom:4px">🍚 搭配白粥或米饭，地道吃法</div>';
  h+='<div style="font-size:13px;color:#666;margin-bottom:4px">🥢 蘸普宁豆酱或鱼露，提鲜增味</div>';
  document.getElementById('mi').innerHTML=h;
}
function cls(){document.getElementById('mdl').className='mdl';}

// 切换tab
function sw(n){
  document.getElementById('btn0').className=n===0?'on':'';
  document.getElementById('btn1').className=n===1?'on':'';
  document.getElementById('p0').style.display=n===0?'':'none';
  document.getElementById('p1').style.display=n===1?'':'none';
  if(n===1)mkb();
}

// 图鉴
function mkb(){var h='';CS.forEach(function(c){h+='<span class="'+(ac===c.n?'on':'')+'" onclick="stc(\''+c.n+'\')">'+c.e+' '+c.n+'</span>';});document.getElementById('cats').innerHTML=h;flt();}
function stc(c){ac=c;mkb();}
function flt(){
  var kw=(document.getElementById('kw').value||'').trim().toLowerCase();
  document.getElementById('clr').style.display=kw?'inline':'none';
  var l=D.slice();
  if(ac!=='全部')l=l.filter(function(d){return d.c===ac;});
  if(kw)l=l.filter(function(d){return d.n.indexOf(kw)>=0||d.c.indexOf(kw)>=0||d.tg.indexOf(kw)>=0;});
  var h='';
  if(l.length===0){h='<div class="emp">🍽️ 没有找到</div>';}
  else{l.forEach(function(d){
    h+='<div class="it" onclick="det('+d.id+')"><div class="ic">'+d.e+'</div><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600">'+d.n+'</div><div style="font-size:10px;color:#999"><span style="color:#E85D3F">'+d.c+'</span> '+ML[d.m]+'</div><div style="font-size:11px;color:#AAA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+d.d+'</div></div><span style="font-size:20px;color:#CCC">›</span></div>';
  });}
  document.getElementById('list').innerHTML=h;
}

// 后台加载远程JSON，更新数据（不影响已有渲染）
setTimeout(function(){
  var x=new XMLHttpRequest();
  x.open('GET','https://qq2793310956-sketch.github.io/chaoshan-foodx/dishes.json?v=8',true);
  x.timeout=5000;
  x.onload=function(){
    if(x.status===200){
      try{
        var rmt=JSON.parse(x.responseText);
        if(rmt&&rmt.length>0){
          // 远程JSON字段名与本地不同，做映射
          D=rmt.map(function(d){
            var tg=d.tags;
            if(Array.isArray(tg))tg=tg.join(',');
            return {id:d.id,n:d.name||d.n,c:d.cat||d.c,e:d.emoji||d.e,m:d.meal||d.m,tg:tg||d.tg,d:d.desc||d.d};
          });
          D.forEach(function(d,i){if(!d.id)d.id=i+1;});
          rdr();document.getElementById('t1').textContent='🍲 明天吃啥？('+D.length+'道)';
        }
      }catch(e){}
    }
  };
  x.send();
},500);
</script>
