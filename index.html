<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🍲 明天吃啥 — 潮汕美食每日推荐</title>
<style>
  :root {
    --red: #E85D3F;
    --red-light: #FFF0EC;
    --gold: #FFB347;
    --bg: #FFF8F3;
    --card: #FFFFFF;
    --text: #333;
    --text-light: #999;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ===== 顶部横幅 ===== */
  .hero {
    background: linear-gradient(135deg, #E85D3F, #FF7B5C 30%, #FF9A76 65%, #FFB347);
    padding: 36px 20px 32px;
    text-align: center;
    color: #FFF;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    top: -40px; right: -30px;
    width: 140px; height: 140px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .hero::before {
    content: '';
    position: absolute;
    bottom: -50px; left: -40px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .hero * { position: relative; z-index: 1; }
  .hero-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .hero-sub {
    font-size: 14px;
    opacity: 0.9;
    margin: 6px 0 10px;
  }
  .hero-date {
    display: inline-block;
    font-size: 13px;
    background: rgba(255,255,255,0.2);
    padding: 4px 20px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
  }

  /* ===== Tab 切换 ===== */
  .tabs {
    display: flex;
    margin: -16px 16px 0;
    position: relative;
    z-index: 10;
    background: #FFF;
    border-radius: 16px;
    padding: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    color: #999;
  }
  .tab.active {
    background: var(--red-light);
    color: var(--red);
  }

  /* ===== 通用区块 ===== */
  .section { margin: 16px; }
  .section-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .section-desc {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 12px;
  }

  /* ===== 推荐卡片 ===== */
  .meal-list { display: flex; flex-direction: column; gap: 12px; }
  .meal-card {
    border-radius: 16px;
    padding: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
    border-left: 5px solid #DDD;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .meal-card:active { transform: scale(0.98); }
  .meal-card.breakfast { border-left-color: #FFB347; background: linear-gradient(135deg, #FFFDF7, #FFF9E6); }
  .meal-card.lunch     { border-left-color: #E85D3F; background: linear-gradient(135deg, #FFFDFB, #FFF0EC); }
  .meal-card.dinner    { border-left-color: #6B7BD0; background: linear-gradient(135deg, #FBFBFF, #F0F0FF); }
  .meal-card.snack     { border-left-color: #5CB85C; background: linear-gradient(135deg, #F9FFF9, #F0FFEF); }
  .meal-tag { font-size: 12px; font-weight: 600; color: #888; margin-bottom: 8px; }
  .meal-row { display: flex; align-items: center; gap: 14px; }
  .meal-emoji { font-size: 52px; flex-shrink: 0; }
  .meal-info { flex: 1; min-width: 0; }
  .meal-name { font-size: 22px; font-weight: 700; }
  .meal-cat { font-size: 12px; color: var(--text-light); }
  .meal-desc {
    font-size: 13px; color: #777; line-height: 1.5; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag {
    font-size: 11px; color: var(--red); background: rgba(232,93,63,0.08);
    padding: 2px 10px; border-radius: 10px;
  }

  /* ===== 主打星 ===== */
  .star-card {
    background: linear-gradient(135deg, #FFFEF5, #FFF8E1);
    border: 2px solid #FFD54F;
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,193,7,0.15);
  }
  .star-card:active { transform: scale(0.98); }
  .star-emoji { font-size: 60px; flex-shrink: 0; }
  .star-info { flex: 1; min-width: 0; }
  .star-name { font-size: 20px; font-weight: 700; }
  .star-cat { font-size: 12px; color: var(--text-light); }
  .star-desc {
    font-size: 13px; color: #888; line-height: 1.5; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ===== 按钮 ===== */
  .actions { margin: 12px 16px; display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: linear-gradient(135deg, #E85D3F, #FF7B5C);
    color: #FFF;
    box-shadow: 0 4px 16px rgba(232,93,63,0.3);
  }
  .btn-outline {
    background: #FFF;
    color: var(--red);
    border: 2px solid var(--red);
  }

  /* ===== 图鉴页 ===== */
  .search-wrap {
    margin: 12px 16px;
    background: #FFF;
    border-radius: 50px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--shadow);
  }
  .search-wrap input {
    flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: #333;
  }
  .search-wrap input::placeholder { color: #CCC; }

  .cat-scroll {
    display: flex; gap: 8px; padding: 4px 16px 8px;
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 20px;
    background: #FFF;
    border: 1.5px solid #EEE;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .cat-chip.active { background: var(--red-light); border-color: var(--red); color: var(--red); font-weight: 600; }

  .dish-list { margin: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .dish-card {
    background: #FFF;
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .dish-card:active { transform: scale(0.98); }
  .dish-icon {
    width: 60px; height: 60px;
    background: var(--bg);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    flex-shrink: 0;
  }
  .dish-body { flex: 1; min-width: 0; }
  .dish-body .name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .dish-body .meta { font-size: 11px; color: var(--text-light); margin-bottom: 3px; }
  .dish-body .meta span { margin-right: 8px; }
  .dish-body .desc {
    font-size: 12px; color: #AAA;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dish-arrow { font-size: 22px; color: #CCC; }

  .empty { text-align: center; padding: 60px 0; color: #CCC; }
  .empty-icon { font-size: 60px; display: block; margin-bottom: 10px; }

  /* ===== 弹窗详情 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal {
    background: #FFF;
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 32px 24px 40px;
    animation: slideUp 0.3s;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 20px;
    width: 32px; height: 32px;
    background: #F5F5F5;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #999;
  }
  .modal-emoji { font-size: 100px; text-align: center; display: block; margin-bottom: 12px; }
  .modal-name { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px; }
  .modal-badges { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .modal-badge {
    font-size: 13px; padding: 4px 16px; border-radius: 20px;
  }
  .modal-badge.cat { background: var(--red-light); color: var(--red); }
  .modal-badge.meal { background: #F5F5F5; color: #666; }
  .modal-desc { font-size: 15px; color: #555; line-height: 1.8; margin-bottom: 16px; }
  .modal-section { margin-bottom: 14px; }
  .modal-section .label { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 6px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .modal-tags .t {
    font-size: 12px; color: var(--red); background: rgba(232,93,63,0.06);
    padding: 4px 14px; border-radius: 16px;
    border: 1px solid rgba(232,93,63,0.12);
  }
  .pair-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666; margin-bottom: 6px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75); color: #FFF;
    padding: 10px 24px; border-radius: 10px;
    font-size: 14px; z-index: 999;
    pointer-events: none;
    animation: toastIn 0.2s, toastOut 0.3s 1s forwards;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%,-50%) scale(0.8); } }
  @keyframes toastOut { to { opacity: 0; } }

  /* 响应式: 大屏居中 */
  @media (min-width: 600px) {
    body { max-width: 500px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.08); min-height: 100vh; }
  }
</style>
</head>
<body>

<!-- ========== 顶部 ========== -->
<div class="hero">
  <div class="hero-title">🍲 明天吃啥？</div>
  <div class="hero-sub">潮汕美食每日推荐</div>
  <div class="hero-date" id="dateDisplay"></div>
</div>

<!-- ========== Tab ========== -->
<div class="tabs">
  <div class="tab active" data-tab="recommend" onclick="switchTab('recommend')">🎯 明日推荐</div>
  <div class="tab" data-tab="browse" onclick="switchTab('browse')">📚 美食图鉴</div>
</div>

<!-- ========== 推荐页 ========== -->
<div id="page-recommend">

  <div class="section" style="margin-top:20px;">
    <div class="section-title">📅 明天菜单</div>
    <div class="section-desc">基于日期智能推荐，每天不重样</div>
    <div class="meal-list" id="mealList"></div>
  </div>

  <div class="section">
    <div class="section-title">⭐ 明日主打星</div>
    <div class="star-card" id="starCard" onclick="showDetail(currentStar.id)"></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="refreshRec()">🔄 换个口味</button>
    <button class="btn btn-outline" onclick="switchTab('browse')">📚 浏览图鉴</button>
  </div>
</div>

<!-- ========== 图鉴页 ========== -->
<div id="page-browse" style="display:none; padding-bottom: 24px;">
  <div class="search-wrap">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="搜索潮汕美食..." oninput="applyFilter()">
    <span id="searchClear" style="display:none;cursor:pointer;color:#CCC;font-size:18px;" onclick="clearSearch()">✕</span>
  </div>
  <div class="cat-scroll" id="catScroll"></div>
  <div class="dish-list" id="dishList"></div>
</div>

<!-- ========== 弹窗 ========== -->
<div class="overlay" id="overlay" style="display:none;" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
// ============================================================
// 潮汕美食数据库（从外部 JSON 加载，修改后自动生效）
// ============================================================
let DISHES = [];
const DISHES_URL = 'https://qq2793310956-sketch.github.io/chaoshan-foodx/dishes.json';

async function loadDishes() {
  try {
    const resp = await fetch(DISHES_URL);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    DISHES = await resp.json();
  } catch(e) {
    // 如果加载失败，用内置兜底数据
    DISHES = BACKUP_DISHES;
  }
  return DISHES;
}
const BACKUP_DISHES = [
  // 粿类
  { id:1,  name:'牛肉粿条',   cat:'粿类', emoji:'🍜', meal:'lunch',    tags:['主食','牛肉','汤'],     desc:'潮汕人的灵魂食物，鲜牛肉片铺在热腾腾的粿条上，浇上滚烫的牛骨汤，配沙茶酱或辣椒酱，一口下去鲜香滑嫩。' },
  { id:2,  name:'红桃粿',     cat:'粿类', emoji:'🥟', meal:'breakfast', tags:['传统','糯米','节日'],   desc:'潮汕传统粿品，糯米粉制成桃形外皮，内馅有糯米香菇花生等，蒸熟后粉红可爱，是过年过节必备。' },
  { id:3,  name:'菜头粿',     cat:'粿类', emoji:'🫓', meal:'breakfast', tags:['煎炸','萝卜','小吃'],   desc:'萝卜糕的潮汕版本，白萝卜丝与米浆蒸制，切块煎至两面金黄，外酥里嫩，蘸鱼露或辣椒酱绝配。' },
  { id:4,  name:'鼠壳粿',     cat:'粿类', emoji:'🌿', meal:'breakfast', tags:['传统','糯米','甜品'],   desc:'用鼠壳草汁染成墨绿色的糯米粿，内馅豆沙或花生芝麻，带独特草本清香，清明时节应季美味。' },
  { id:5,  name:'无米粿',     cat:'粿类', emoji:'🫕', meal:'snack',    tags:['素食','煎炸','小吃'],   desc:'用番薯粉做皮，包入韭菜、豆芽等馅料，煎至透明晶莹，外Q内香，潮汕经典素粿。' },
  // 海鲜
  { id:6,  name:'潮汕生腌',   cat:'海鲜', emoji:'🦀', meal:'dinner',   tags:['生食','螃蟹','虾','重口味'], desc:'被誉为"潮汕毒药"，酱油蒜头辣椒香菜腌制鲜活蟹虾，生猛鲜美，吃过就上瘾。初次尝试建议配热粥。' },
  { id:7,  name:'蚝烙',       cat:'海鲜', emoji:'🦪', meal:'lunch',    tags:['煎炸','蚝','鸡蛋'],    desc:'鲜蚝与番薯粉浆混合煎制，加鸡蛋和葱花，煎到金黄酥脆。外酥里嫩，蚝肉鲜甜与蛋香交融。' },
  { id:8,  name:'鱼饭',       cat:'海鲜', emoji:'🐟', meal:'dinner',   tags:['传统','冷食','鱼'],     desc:'潮汕渔民古老智慧——新鲜海鱼直接用海水煮熟放凉，鱼肉紧实鲜甜，冷吃更显鲜美。配白粥或普宁豆酱。' },
  { id:9,  name:'虾丸/虾枣',  cat:'海鲜', emoji:'🦐', meal:'lunch',    tags:['丸子','虾','火锅'],    desc:'手打鲜虾肉制成，弹牙爽口，虾味浓郁。可煮汤、油炸或下火锅，潮汕宴席必备硬菜。' },
  { id:10, name:'炒薄壳',     cat:'海鲜', emoji:'🐚', meal:'dinner',   tags:['小炒','贝壳','下酒'],   desc:'薄壳（海瓜子）是潮汕人心头好，加九层塔（金不换）、蒜蓉辣椒爆炒，鲜香四溢，一粒一粒停不下来。' },
  // 卤味
  { id:11, name:'卤鹅',       cat:'卤味', emoji:'🦆', meal:'dinner',   tags:['卤水','鹅','宴客'],    desc:'潮汕卤水巅峰之作，狮头鹅经数小时卤制，皮滑肉嫩，卤香入骨。鹅肝、鹅掌、鹅翅、鹅肠各自精彩，配蒜泥醋解腻。' },
  { id:12, name:'卤水拼盘',   cat:'卤味', emoji:'🍖', meal:'dinner',   tags:['卤水','拼盘','下酒'],   desc:'鹅肉、猪耳、豆干、卤蛋等多样卤味切片拼盘，一碟尝遍卤水精华，下饭下酒两相宜。' },
  { id:13, name:'隆江猪脚饭', cat:'卤味', emoji:'🍖', meal:'lunch',    tags:['卤水','猪肉','米饭','快餐'], desc:'源自揭阳隆江，猪脚用秘制卤水长时间熬煮，皮糯肉烂、胶质满满，浇在热米饭上，配酸菜解腻。' },
  // 汤品
  { id:14, name:'牛肉丸汤',   cat:'汤品', emoji:'🍢', meal:'lunch',    tags:['丸子','牛肉','汤'],    desc:'潮汕手打牛肉丸，弹到可以当乒乓球打。配清汤和蒜头酥、芹菜末，简单纯粹，却鲜掉眉毛。' },
  { id:15, name:'猪肚汤',     cat:'汤品', emoji:'🍲', meal:'dinner',   tags:['猪肚','滋补','汤'],    desc:'猪肚与胡椒、酸菜同煲，汤色乳白，胡椒辛香暖胃驱寒，酸菜提鲜解腻，潮汕人冬季滋补首选。' },
  { id:16, name:'潮汕砂锅粥', cat:'汤品', emoji:'🥣', meal:'dinner',   tags:['粥','海鲜','夜宵'],    desc:'不同于广式粥的绵密，潮汕粥粒粒分明米香浓郁。加入虾蟹、田鸡或排骨同熬，鲜甜渗透每粒米。' },
  // 小炒
  { id:17, name:'芥兰炒牛肉', cat:'小炒', emoji:'🥬', meal:'lunch',    tags:['家常','牛肉','蔬菜'],   desc:'潮汕经典家常菜，脆嫩芥兰与嫩滑牛肉片爆炒，镬气十足。芥兰清甜与牛肉鲜美相得益彰。' },
  { id:18, name:'菜脯蛋',     cat:'小炒', emoji:'🍳', meal:'breakfast',tags:['家常','鸡蛋','快手'],   desc:'潮汕最家常的味道——萝卜干（菜脯）切碎与蛋液混合煎成，咸香脆口，配白粥就是完美一餐。' },
  { id:19, name:'潮州蒸鱼',   cat:'小炒', emoji:'🐠', meal:'dinner',   tags:['鱼','清蒸','家常'],    desc:'新鲜海鱼加酸梅、咸菜、姜丝、番茄清蒸，酸甜咸鲜层层递进。不破坏鱼肉本味的同时增添丰富层次。' },

// ============================================================
// 工具函数
// ============================================================
function hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function seedRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// ============================================================
// 推荐引擎
// ============================================================
function getDailyRec(date) {
  const ds = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
  const seed = hashStr(ds);
  const rand = seedRandom(seed);

  // 按餐次分组
  const byMeal = { breakfast:[], lunch:[], dinner:[], snack:[] };
  DISHES.forEach(d => { if (byMeal[d.meal]) byMeal[d.meal].push(d); });

  // 打乱每组的顺序
  const shuffle = (arr, r) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const meals = ['breakfast','lunch','dinner','snack'];
  const result = {};
  const usedIds = new Set();

  meals.forEach((meal, i) => {
    const pool = shuffle(byMeal[meal], rand);
    // 优先选没被用过的
    const pick = pool.find(d => !usedIds.has(d.id)) || pool[0];
    if (pick) {
      usedIds.add(pick.id);
      result[meal] = pick;
    }
  });

  // 主打星从不重复之外选
  const starPool = shuffle(DISHES.filter(d => !usedIds.has(d.id)), rand);
  result.star = starPool[0] || DISHES[Math.floor(rand() * DISHES.length)];

  return result;
}

function getTomorrowRec() {
  const t = new Date();
  t.setDate(t.getDate() + 1);
  return getDailyRec(t);
}

function renderRecPage() {

  const mealList = document.getElementById('mealList');

  mealList.innerHTML = meals.map(meal => {
    const d = currentRec[meal];
    if (!d) return '';
    return `
      <div class="meal-card ${meal}" onclick="showDetail(${d.id})">
        <div class="meal-tag">${MEAL_NAMES[meal]}</div>
        <div class="meal-row">
          <span class="meal-emoji">${d.emoji}</span>
          <div class="meal-info">
            <div class="meal-name">${d.name}</div>
            <div class="meal-cat">${d.cat}</div>
          </div>
        </div>
        <div class="meal-desc">${d.desc}</div>
        <div class="meal-tags">${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>`;
  }).join('');

  // 主打星
  const s = currentRec.star;
  currentStar = s;
  document.getElementById('starCard').innerHTML = s ? `
    <span class="star-emoji">${s.emoji}</span>
    <div class="star-info">
      <div class="star-name">${s.name}</div>
      <div class="star-cat">${s.cat}</div>
      <div class="star-desc">${s.desc}</div>
    </div>
    <span style="font-size:28px;color:#CCC;">›</span>
  ` : '';
}

function refreshRec() {
  // 纯随机推荐
  const shuffled = [...DISHES].sort(() => Math.random() - 0.5);
  const byMeal = { breakfast:[], lunch:[], dinner:[], snack:[] };
  shuffled.forEach(d => { if (byMeal[d.meal] && byMeal[d.meal].length < 1) byMeal[d.meal].push(d); });

  const usedIds = new Set();
  const meals = ['breakfast','lunch','dinner','snack'];
  const rec = {};
  meals.forEach(meal => {
    const d = byMeal[meal][0] || DISHES.find(x => x.meal === meal && !usedIds.has(x.id));
    if (d) { usedIds.add(d.id); rec[meal] = d; }
  });
  rec.star = shuffled.find(d => !usedIds.has(d.id)) || DISHES[Math.floor(Math.random()*DISHES.length)];
  currentRec = rec;
  currentStar = rec.star;

  // 重新渲染
  const mealList = document.getElementById('mealList');
  meals.forEach((meal, i) => {
    const d = rec[meal];
    if (!d) return;
    const card = mealList.children[i];
    if (card) {
      card.className = `meal-card ${meal}`;
      card.setAttribute('onclick', `showDetail(${d.id})`);
      card.querySelector('.meal-emoji').textContent = d.emoji;
      card.querySelector('.meal-name').textContent = d.name;
      card.querySelector('.meal-cat').textContent = d.cat;
      card.querySelector('.meal-desc').textContent = d.desc;
      card.querySelector('.meal-tags').innerHTML = d.tags.map(t => `<span class="tag">${t}</span>`).join('');
    }
  });
  document.getElementById('starCard').innerHTML = rec.star ? `
    <span class="star-emoji">${rec.star.emoji}</span>
    <div class="star-info">
      <div class="star-name">${rec.star.name}</div>
      <div class="star-cat">${rec.star.cat}</div>
      <div class="star-desc">${rec.star.desc}</div>
    </div>
    <span style="font-size:28px;color:#CCC;">›</span>
  ` : '';

  showToast('已刷新推荐 ✨');
}

function renderBrowsePage() {
  // 分类标签
  document.getElementById('catScroll').innerHTML = CATS.map(c =>
    `<div class="cat-chip${activeCat===c.name?' active':''}" onclick="setCat('${c.name}')">${c.emoji} ${c.name}</div>`
  ).join('');
  applyFilter();
}

function setCat(cat) {
  activeCat = cat;
  renderBrowsePage();
}

function applyFilter() {
  const kw = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  searchKeyword = kw;
  document.getElementById('searchClear').style.display = kw ? 'inline' : 'none';

  let list = DISHES;
  if (activeCat !== '全部') list = list.filter(d => d.cat === activeCat);
  if (kw) {
    list = list.filter(d =>
      d.name.includes(kw) || d.cat.includes(kw) || d.desc.includes(kw) ||
      d.tags.some(t => t.includes(kw))
    );
  }

  const container = document.getElementById('dishList');
  if (list.length === 0) {
    container.innerHTML = `<div class="empty"><span class="empty-icon">🍽️</span>没有找到相关美食<br><span style="font-size:12px;color:#DDD;">试试其他关键词吧</span></div>`;
    return;
  }
  container.innerHTML = list.map(d => `
    <div class="dish-card" onclick="showDetail(${d.id})">
      <div class="dish-icon">${d.emoji}</div>
      <div class="dish-body">
        <div class="name">${d.name}</div>
        <div class="meta"><span style="color:var(--red);">${d.cat}</span><span>${MEAL_NAMES[d.meal]}</span></div>
        <div class="desc">${d.desc}</div>
      </div>
      <span class="dish-arrow">›</span>
    </div>
  `).join('');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchKeyword = '';
  document.getElementById('searchClear').style.display = 'none';
  applyFilter();
}

  if (!d) return;
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('modal').innerHTML = `
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <span class="modal-emoji">${d.emoji}</span>
    <div class="modal-name">${d.name}</div>
    <div class="modal-badges">
      <span class="modal-badge cat">${d.cat}</span>
      <span class="modal-badge meal">${MEAL_NAMES[d.meal]}</span>
    </div>
    <div class="modal-desc">${d.desc}</div>
    <div class="modal-section">
      <div class="label">🏷️ 标签</div>
      <div class="modal-tags">${d.tags.map(t => `<span class="t">${t}</span>`).join('')}</div>
    </div>
    <div class="modal-section">
      <div class="label">🍵 搭配建议</div>
      <div class="pair-item"><span>🍵</span> 配一壶功夫茶，解腻回甘</div>
      <div class="pair-item"><span>🍚</span> 搭配白粥或米饭，地道潮汕吃法</div>
      <div class="pair-item"><span>🥢</span> 蘸普宁豆酱或鱼露，提鲜增味</div>
    </div>
  `;
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').style.display = 'none';
    document.body.style.overflow = '';
  }
}
function closeModalDirect() {
  document.getElementById('overlay').style.display = 'none';
  document.body.style.overflow = '';
}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.getElementById('page-recommend').style.display = tab === 'recommend' ? '' : 'none';
  document.getElementById('page-browse').style.display = tab === 'browse' ? '' : 'none';
  if (tab === 'browse') renderBrowsePage();
}

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1400);
}

// 初始化
// ============================================================
async function init() {
  // 日期显示
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const wd = ['日','一','二','三','四','五','六'];
  document.getElementById('dateDisplay').textContent =
    `${tomorrow.getFullYear()}年${tomorrow.getMonth()+1}月${tomorrow.getDate()}日 星期${wd[tomorrow.getDay()]}`;

  // 先从外部加载菜单数据，再渲染
  await loadDishes();
  renderRecPage();
}

document.addEventListener('DOMContentLoaded', init);
</script>
