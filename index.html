<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#FFF8F3;color:#333;max-width:500px;margin:0 auto;min-height:100vh}
.hero{background:linear-gradient(135deg,#E85D3F,#FF7B5C,#FF9A76,#FFB347);padding:30px 16px 28px;text-align:center;color:#FFF}
.hero h1{font-size:32px;font-weight:800}
.hero p{font-size:13px;opacity:.9;margin:4px 0}
.hero span{font-size:12px;background:rgba(255,255,255,.2);padding:3px 16px;border-radius:20px}
.tab-bar{display:flex;margin:-12px 12px 0;background:#FFF;border-radius:14px;padding:3px;box-shadow:0 2px 12px rgba(0,0,0,.08);position:relative;z-index:10}
.tab-bar button{flex:1;padding:10px;font-size:14px;font-weight:600;border-radius:12px;border:none;background:none;color:#999;cursor:pointer}
.tab-bar button.on{background:#FFF0EC;color:#E85D3F}
.section{margin:12px}
.section h2{font-size:18px;margin-bottom:2px}
.section .note{font-size:11px;color:#999;margin-bottom:10px}
.card{border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid #DDD;cursor:pointer;background:#FFF;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.card:active{transform:scale(.98)}
.card.bf{border-left-color:#FFB347;background:#FFFDF7}
.card.ln{border-left-color:#E85D3F;background:#FFFDFB}
.card.dn{border-left-color:#6B7BD0;background:#FBFBFF}
.card.sn{border-left-color:#5CB85C;background:#F9FFF9}
.card .lbl{font-size:11px;font-weight:600;color:#888;margin-bottom:6px}
.card .row{display:flex;align-items:center;gap:10px}
.card .em{font-size:44px;flex-shrink:0}
.card .nm{font-size:20px;font-weight:700}
.card .ct{font-size:11px;color:#999}
.card .dc{font-size:12px;color:#777;line-height:1.5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tgs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.card .tgs span{font-size:10px;color:#E85D3F;background:rgba(232,93,63,.08);padding:2px 8px;border-radius:8px}
.star{background:#FFFEF5;border:2px solid #FFD54F;border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 2px 10px rgba(255,193,7,.15)}
.star .em{font-size:48px}
.star .nm{font-size:18px;font-weight:700}
.star .ct{font-size:11px;color:#999}
.star .dc{font-size:12px;color:#888;line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{margin:10px 12px;display:flex;gap:8px}
.btns button{flex:1;padding:12px;font-size:15px;font-weight:600;border-radius:40px;border:none;cursor:pointer}
.btns .pri{background:linear-gradient(135deg,#E85D3F,#FF7B5C);color:#FFF;box-shadow:0 3px 12px rgba(232,93,63,.3)}
.btns .sec{background:#FFF;color:#E85D3F;border:2px solid #E85D3F}
.btns button:active{transform:scale(.96)}
.srch{margin:10px 12px;background:#FFF;border-radius:40px;padding:8px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.srch input{flex:1;border:none;outline:none;font-size:14px;background:none}
.cats{display:flex;gap:6px;padding:2px 12px 6px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats span{flex-shrink:0;padding:6px 12px;font-size:12px;border-radius:16px;background:#FFF;border:1px solid #EEE;cursor:pointer;white-space:nowrap}
.cats span.on{background:#FFF0EC;border-color:#E85D3F;color:#E85D3F;font-weight:600}
.list{margin:6px 12px}
.list .item{background:#FFF;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.list .item:active{transform:scale(.98)}
.list .ico{width:50px;height:50px;background:#FFF8F3;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.list .nm{font-size:15px;font-weight:600}
.list .mt{font-size:10px;color:#999}
.list .dc{font-size:11px;color:#AAA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp{text-align:center;padding:40px;color:#CCC;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;justify-content:center;align-items:flex-end}
.modal.on{display:flex}
.modal .inner{background:#FFF;border-radius:22px 22px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:28px 20px 36px;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.modal .cls{position:absolute;top:12px;right:16px;width:28px;height:28px;background:#F0F0F0;border-radius:50%;border:none;font-size:16px;cursor:pointer;color:#999}
.modal .em{font-size:80px;text-align:center;display:block;margin-bottom:8px}
.modal h3{font-size:24px;text-align:center;margin-bottom:4px}
.modal .bds{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.modal .bd{padding:3px 14px;border-radius:14px;font-size:12px}
.modal .bd.cc{background:#FFF0EC;color:#E85D3F}
.modal .bd.mm{background:#F5F5F5;color:#666}
.modal .dsc{font-size:14px;color:#555;line-height:1.7;margin-bottom:12px}
.modal .ms{font-size:12px;font-weight:600;color:#888;margin-bottom:4px}
.modal .ts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.modal .ts span{font-size:11px;color:#E85D3F;background:rgba(232,93,63,.06);padding:3px 12px;border-radius:12px;border:1px solid rgba(232,93,63,.1)}
.modal .pr{font-size:13px;color:#666;margin-bottom:4px}
</style>
</head>

<script>
// 53道菜 内置数据
var D=[
{n:'牛肉粿条',c:'粿类',e:'🍜',m:'lunch',t:['主食','牛肉','汤'],d:'潮汕人的灵魂食物，鲜牛肉片铺在热腾腾的粿条上，浇上滚烫的牛骨汤，配沙茶酱或辣椒酱，一口下去鲜香滑嫩。'},
{n:'红桃粿',c:'粿类',e:'🥟',m:'breakfast',t:['传统','糯米','节日'],d:'潮汕传统粿品，糯米粉制成桃形外皮，内馅有糯米香菇花生等，蒸熟后粉红可爱，是过年过节必备。'},
{n:'菜头粿',c:'粿类',e:'🫓',m:'breakfast',t:['煎炸','萝卜','小吃'],d:'萝卜糕的潮汕版本，白萝卜丝与米浆蒸制，切块煎至两面金黄，外酥里嫩，蘸鱼露或辣椒酱绝配。'},
{n:'鼠壳粿',c:'粿类',e:'🌿',m:'breakfast',t:['传统','糯米','甜品'],d:'用鼠壳草汁染成墨绿色的糯米粿，内馅豆沙或花生芝麻，带独特草本清香，清明时节应季美味。'},
{n:'无米粿',c:'粿类',e:'🫕',m:'snack',t:['素食','煎炸','小吃'],d:'用番薯粉做皮，包入韭菜豆芽等馅料，煎至透明晶莹，外Q内香，潮汕经典素粿。'},
{n:'潮汕生腌',c:'海鲜',e:'🦀',m:'dinner',t:['生食','螃蟹','虾','重口味'],d:'被誉为潮汕毒药，酱油蒜头辣椒香菜腌制鲜活蟹虾，生猛鲜美，吃过就上瘾。初次尝试建议配热粥。'},
{n:'蚝烙',c:'海鲜',e:'🦪',m:'lunch',t:['煎炸','蚝','鸡蛋'],d:'鲜蚝与番薯粉浆混合煎制，加鸡蛋和葱花，煎到金黄酥脆。外酥里嫩，蚝肉鲜甜与蛋香交融。'},
{n:'鱼饭',c:'海鲜',e:'🐟',m:'dinner',t:['传统','冷食','鱼'],d:'潮汕渔民古老智慧——新鲜海鱼直接用海水煮熟放凉，鱼肉紧实鲜甜，冷吃更显鲜美。配白粥或普宁豆酱。'},
{n:'虾丸虾枣',c:'海鲜',e:'🦐',m:'lunch',t:['丸子','虾','火锅'],d:'手打鲜虾肉制成，弹牙爽口，虾味浓郁。可煮汤、油炸或下火锅，潮汕宴席必备硬菜。'},
{n:'炒薄壳',c:'海鲜',e:'🐚',m:'dinner',t:['小炒','贝壳','下酒'],d:'薄壳就是海瓜子，潮汕人心头好，加九层塔蒜蓉辣椒爆炒，鲜香四溢一粒一粒停不下来。'},
{n:'卤鹅',c:'卤味',e:'🦆',m:'dinner',t:['卤水','鹅','宴客'],d:'潮汕卤水巅峰之作，狮头鹅经数小时卤制，皮滑肉嫩卤香入骨。鹅肝鹅掌鹅翅鹅肠各自精彩，配蒜泥醋解腻。'},
{n:'卤水拼盘',c:'卤味',e:'🍖',m:'dinner',t:['卤水','拼盘','下酒'],d:'鹅肉猪耳豆干卤蛋等多样卤味切片拼盘，一碟尝遍卤水精华，下饭下酒两相宜。'},
{n:'隆江猪脚饭',c:'卤味',e:'🍖',m:'lunch',t:['卤水','猪肉','米饭','快餐'],d:'源自揭阳隆江，猪脚用秘制卤水长时间熬煮，皮糯肉烂胶质满满，浇在热米饭上配酸菜解腻。'},
{n:'牛肉丸汤',c:'汤品',e:'🍢',m:'lunch',t:['丸子','牛肉','汤'],d:'潮汕手打牛肉丸，弹到可以当乒乓球打。配清汤和蒜头酥芹菜末，简单纯粹却鲜掉眉毛。'},
{n:'猪肚汤',c:'汤品',e:'🍲',m:'dinner',t:['猪肚','滋补','汤'],d:'猪肚与胡椒酸菜同煲，汤色乳白，胡椒辛香暖胃驱寒，酸菜提鲜解腻，潮汕人冬季滋补首选。'},
{n:'潮汕砂锅粥',c:'汤品',e:'🥣',m:'dinner',t:['粥','海鲜','夜宵'],d:'不同于广式粥的绵密，潮汕粥粒粒分明米香浓郁。加入虾蟹田鸡或排骨同熬，鲜甜渗透每粒米。'},
{n:'芥兰炒牛肉',c:'小炒',e:'🥬',m:'lunch',t:['家常','牛肉','蔬菜'],d:'潮汕经典家常菜，脆嫩芥兰与嫩滑牛肉片爆炒，镬气十足。芥兰清甜与牛肉鲜美相得益彰。'},
{n:'菜脯蛋',c:'小炒',e:'🍳',m:'breakfast',t:['家常','鸡蛋','快手'],d:'潮汕最家常的味道——萝卜干切碎与蛋液混合煎成，咸香脆口，配白粥就是完美一餐。'},
{n:'潮州蒸鱼',c:'小炒',e:'🐠',m:'dinner',t:['鱼','清蒸','家常'],d:'新鲜海鱼加酸梅咸菜姜丝番茄清蒸，酸甜咸鲜层层递进。不破坏鱼肉本味的同时增添丰富层次。'},
{n:'普宁豆酱炒通菜',c:'小炒',e:'🥗',m:'lunch',t:['家常','蔬菜','素食'],d:'空心菜用普宁豆酱炒制，豆酱的咸鲜酵香与脆嫩通菜是天生一对，简单快手却下饭一流。'},
{n:'潮汕甜汤',c:'甜点',e:'🍯',m:'snack',t:['甜品','滋补','热食'],d:'不是糖水是甜汤。芋头白果薏米莲子银耳等慢火熬制，温润滋补甜而不腻。'},
{n:'芋泥',c:'甜点',e:'🍠',m:'snack',t:['甜品','芋头','传统'],d:'选用潮汕特产香芋蒸熟压泥，加猪油和糖炒至绵密顺滑，入口即化。可做芋泥白果芋泥月饼等。'},
{n:'绿豆爽',c:'甜点',e:'🫘',m:'snack',t:['甜品','绿豆','夏季'],d:'去皮绿豆煮至绵软，加冰糖和马蹄粒，清香爽口，夏天冰镇后喝一碗消暑解热。'},
{n:'反沙芋',c:'甜点',e:'🧈',m:'snack',t:['甜品','芋头','传统'],d:'芋头条炸至金黄裹上白糖霜，外甜内酥粉糯香甜。看似简单，火候功夫全在反沙这一步。'},
{n:'春卷',c:'小吃',e:'🥐',m:'snack',t:['煎炸','传统','小吃'],d:'潮汕春卷皮薄馅大，绿豆畔肉末香菇等入馅，炸至金黄酥脆，咬下去咔嚓作响满口留香。'},
{n:'猪肠胀糯米',c:'小吃',e:'🌭',m:'snack',t:['糯米','猪肉','传统'],d:'猪肠洗净灌入糯米花生香菇猪肉等，煮熟切片蘸甜酱油或桔油，糯香与腊味交融。'},
{n:'肠粉',c:'小吃',e:'📜',m:'breakfast',t:['米浆','早餐','快手'],d:'潮汕肠粉比广式更薄更滑，内馅丰富有牛肉猪肉虾仁鸡蛋生菜，淋特制酱汁和蒜头油。'},
{n:'炒糕粿',c:'小吃',e:'🧈',m:'snack',t:['煎炸','米浆','传统'],d:'米浆糕切块煎至两面金黄，加鸡蛋豆芽韭菜同炒，外焦里糯，蘸白糖吃是潮汕独特风味。'},
{n:'潮州粥',c:'主食',e:'🍚',m:'breakfast',t:['粥','家常','日常'],d:'潮汕人日常必备，米粒分明米汤清甜。配橄榄菜咸菜菜脯蛋卤味等各种杂咸，简简单单就是家的味道。'},
{n:'戈饭',c:'主食',e:'🍛',m:'lunch',t:['米饭','家常','芋头'],d:'潮汕版焖饭，芋头腊肉香菇等与米饭同煮，开锅时香气四溢。每一粒米都吸饱了食材精华。'},
{n:'猪排',c:'家常菜',e:'🍖',m:'lunch',t:['猪肉','煎炸','家常'],d:'大块猪排腌制入味后煎至两面金黄，外酥里嫩肉汁饱满，配米饭或意面都绝佳。'},
{n:'小酥肉',c:'家常菜',e:'🥩',m:'snack',t:['猪肉','煎炸','小吃'],d:'猪肉条裹上薄薄的面糊炸至金黄酥脆，外酥里嫩咸香可口，撒上椒盐或蘸番茄酱都好吃。'},
{n:'可乐鸡翅',c:'家常菜',e:'🍗',m:'lunch',t:['鸡肉','可乐','家常'],d:'鸡翅用可乐和酱油炖煮，甜咸交织色泽红亮，鸡肉嫩滑入味，大人小孩都爱吃。'},
{n:'青椒炒肉',c:'家常菜',e:'🫑',m:'lunch',t:['猪肉','辣椒','家常'],d:'经典家常菜，猪肉片与青椒爆炒，肉嫩椒香镬气十足，下饭一绝。'},
{n:'炒花甲',c:'海鲜',e:'🐚',m:'dinner',t:['贝壳','小炒','下酒'],d:'花甲吐沙后加蒜蓉辣椒爆炒，壳开肉嫩鲜美多汁，汤汁拌饭也是一绝。'},
{n:'蒜香螃蟹',c:'海鲜',e:'🦀',m:'dinner',t:['螃蟹','蒜香','宴客'],d:'螃蟹斩件后加大量蒜蓉爆炒，蒜香四溢蟹肉鲜甜，吮指回味。'},
{n:'茄子煲',c:'家常菜',e:'🍆',m:'lunch',t:['蔬菜','家常','下饭'],d:'茄子切块过油后入砂锅焖煮，加肉末和酱汁，软糯入味咸香微辣，米饭杀手。'},
{n:'苦瓜炒蛋',c:'家常菜',e:'🥒',m:'lunch',t:['鸡蛋','苦瓜','家常'],d:'苦瓜切薄片与鸡蛋同炒，苦中回甘蛋香浓郁，清热解暑又下饭。'},
{n:'西红柿炒蛋',c:'家常菜',e:'🍅',m:'lunch',t:['鸡蛋','番茄','家常','快手'],d:'国民家常菜，番茄酸甜与鸡蛋嫩滑完美融合，简单快手却百吃不厌。'},
{n:'炒莲藕',c:'家常菜',e:'🪷',m:'lunch',t:['蔬菜','家常','清爽'],d:'莲藕切片清炒，脆嫩爽口清甜回甘，加少许醋更添风味，清爽解腻。'},
{n:'红烧排骨',c:'家常菜',e:'🍖',m:'dinner',t:['猪肉','红烧','硬菜'],d:'排骨焯水后加酱油糖色慢炖，肉质酥烂酱香浓郁色泽红亮，宴客硬菜。'},
{n:'炸鸡翅',c:'小吃',e:'🍗',m:'snack',t:['鸡肉','煎炸','小吃'],d:'鸡翅腌制后裹粉油炸至金黄酥脆，外皮香脆肉质嫩滑多汁，蘸番茄酱或甜辣酱。'},

{n:'炒饭',c:'主食',e:'🍚',m:'lunch',t:['米饭','家常','快手'],d:'隔夜米饭加鸡蛋火腿虾仁等配料炒制，粒粒分明香浓可口，一碟满足。'}

var ML={breakfast:'🌅 早餐',lunch:'☀️ 午餐',dinner:'🌙 晚餐',snack:'🍪 小吃点心'};
var CS=[{n:'全部',e:'🔥'},{n:'粿类',e:'🥟'},{n:'海鲜',e:'🦀'},{n:'卤味',e:'🍖'},{n:'家常菜',e:'🏠'},{n:'汤品',e:'🍲'},{n:'小炒',e:'🥬'},{n:'甜点',e:'🍯'},{n:'小吃',e:'🥐'},{n:'主食',e:'🍚'}];
var ac='全部';
var cr=null;
var cs=null;

function H(s){var h=0,i;for(i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function R(s){return function(){s=(s*16807)%2147483647;return(s-1)/2147483646;}}

function daily(dt){
  var ds=dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate();
  var r=R(H(ds));
  var bm={breakfast:[],lunch:[],dinner:[],snack:[]};
  D.forEach(function(d){if(bm[d.m])bm[d.m].push(d);});
  var u={},o={};
  ['breakfast','lunch','dinner','snack'].forEach(function(m){
    var p=bm[m].slice();
    for(var i=p.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=p[i];p[i]=p[j];p[j]=t;}
    var g=null;
    for(var i=0;i<p.length;i++){if(!u[p[i].id]){g=p[i];break;}}
    if(!g)g=p[0];
    if(g){u[g.id]=true;o[m]=g;}
  });
  var left=D.filter(function(d){return !u[d.id];});
  for(var i=left.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=left[i];left[i]=left[j];left[j]=t;}
  o.star=left[0]||D[0];
  return o;
}

function render(){
  var t=new Date();t.setDate(t.getDate()+1);
  cr=daily(t);cs=cr.star;
  var h='';
  ['breakfast','lunch','dinner','snack'].forEach(function(m){
    var d=cr[m];if(!d)return;
    h+='<div class="card '+m.substring(0,2)+'" onclick="detail('+d.id+')">';
    h+='<div class="lbl">'+ML[m]+'</div>';
    h+='<div class="row"><span class="em">'+d.e+'</span><div><div class="nm">'+d.n+'</div><div class="ct">'+d.c+'</div></div></div>';
    h+='<div class="dc">'+d.d+'</div>';
    h+='<div class="tgs">';
    d.t.forEach(function(tg){h+='<span>'+tg+'</span>';});
    h+='</div></div>';
  });
  document.getElementById('cards').innerHTML=h;
  var s=cr.star;
  if(s){
    document.getElementById('star').innerHTML='<div class="star" onclick="detail('+s.id+')"><span class="em">'+s.e+'</span><div><div class="nm">'+s.n+'</div><div class="ct">'+s.c+'</div><div class="dc">'+s.d+'</div></div><span style="font-size:24px;color:#CCC;">›</span></div>';
  }
}

function initDate(){
  var t=new Date();t.setDate(t.getDate()+1);
  var wd=['日','一','二','三','四','五','六'];
  document.getElementById('date').textContent=t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日 星期'+wd[t.getDay()];
}

function shuffle(){
  var arr=D.slice();
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  var bm={breakfast:[],lunch:[],dinner:[],snack:[]};
  arr.forEach(function(d){if(bm[d.m]&&bm[d.m].length<1)bm[d.m].push(d);});
  var u={},o={};
  ['breakfast','lunch','dinner','snack'].forEach(function(m){
    var p=bm[m][0]||arr.find(function(d){return d.m===m&&!u[d.id];});
    if(p){u[p.id]=true;o[m]=p;}
  });
  o.star=arr.find(function(d){return !u[d.id];})||arr[0];
  cr=o;cs=o.star;
  render();
}

function show(tab){
  document.querySelectorAll('.tab-bar button')[0].className=tab==='rec'?'on':'';
  document.querySelectorAll('.tab-bar button')[1].className=tab==='browse'?'on':'';
  document.getElementById('rec-page').style.display=tab==='rec'?'':'none';
  document.getElementById('browse-page').style.display=tab==='browse'?'':'none';
  if(tab==='browse') makeBrowse();
}

function makeBrowse(){
  var h='';
  CS.forEach(function(c){h+='<span class="'+(ac===c.n?'on':'')+'" onclick="setCat(\''+c.n+'\')">'+c.e+' '+c.n+'</span>';});
  document.getElementById('cats').innerHTML=h;
  filter();
}
function setCat(c){ac=c;makeBrowse();}
function filter(){
  var kw=(document.getElementById('kw').value||'').trim().toLowerCase();
  document.getElementById('clr').style.display=kw?'inline':'none';
  var l=D.slice();
  if(ac!=='全部')l=l.filter(function(d){return d.c===ac;});
  if(kw)l=l.filter(function(d){return d.n.indexOf(kw)>=0||d.c.indexOf(kw)>=0||d.d.indexOf(kw)>=0||d.t.some(function(t){return t.indexOf(kw)>=0;});});
  var h='';
  if(l.length===0){
    h='<div class="emp">🍽️ 没有找到</div>';
  }else{
    l.forEach(function(d){
      h+='<div class="item" onclick="detail('+d.id+')"><div class="ico">'+d.e+'</div><div style="flex:1;min-width:0"><div class="nm">'+d.n+'</div><div class="mt"><span style="color:#E85D3F">'+d.c+'</span> '+ML[d.m]+'</div><div class="dc">'+d.d+'</div></div><span style="font-size:20px;color:#CCC">›</span></div>';
    });
  }
  document.getElementById('list').innerHTML=h;
}

// 为每道菜分配 id（基于数组索引）
D.forEach(function(d,i){d.id=i+1;});

function detail(id){
  var d=D.find(function(x){return x.id===id;});if(!d)return;
  document.getElementById('modal').className='modal on';
  var h='<button class="cls" onclick="closeM()">✕</button>';
  h+='<span class="em">'+d.e+'</span>';
  h+='<h3>'+d.n+'</h3>';
  h+='<div class="bds"><span class="bd cc">'+d.c+'</span><span class="bd mm">'+ML[d.m]+'</span></div>';
  h+='<div class="dsc">'+d.d+'</div>';
  h+='<div class="ms">🏷️ 标签</div><div class="ts">';
  d.t.forEach(function(t){h+='<span>'+t+'</span>';});
  h+='</div><div class="ms">🍵 搭配建议</div>';
  h+='<div class="pr">🍵 配一壶功夫茶，解腻回甘</div>';
  h+='<div class="pr">🍚 搭配白粥或米饭，地道吃法</div>';
  h+='<div class="pr">🥢 蘸普宁豆酱或鱼露，提鲜增味</div>';
  document.getElementById('minner').innerHTML=h;
}
function closeM(){document.getElementById('modal').className='modal';}

// 页面初始化
initDate();
render();
document.getElementById('title').textContent = '🍲 明天吃啥？('+D.length+'道菜已加载)';

// 后台加载远程 dishes.json 更新数据
setTimeout(function(){
  var x=new XMLHttpRequest();
  x.open('GET','https://qq2793310956-sketch.github.io/chaoshan-foodx/dishes.json?v=6',true);
  x.timeout=5000;
  x.onload=function(){
    if(x.status===200){
      try{
        var data=JSON.parse(x.responseText);
        if(data&&data.length>0){D=data;D.forEach(function(d,i){d.id=d.id||i+1;});render();}
      }catch(e){}
    }
  };
  x.send();
},200);
</script>
