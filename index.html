  var ds=dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate();
  var r=R(H(ds));
  // 按餐次分桶
  var bm={};meals.forEach(function(m){bm[m]=[];});
  D.forEach(function(d){bm[d.m].push(d);});
  // 每个桶里挑一个（去重）
  var used={},o={};
  meals.forEach(function(m){
    var pool=bm[m].slice();
    // 洗牌
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
    // 选第一个没用过的
    var pick=null;
    for(var k=0;k<pool.length;k++){if(!used[pool[k].id]){pick=pool[k];break;}}
    if(!pick)pick=pool[0];
    used[pick.id]=1;o[m]=pick;
  });
  // 主打星
  var rest=D.filter(function(d){return !used[d.id];});
  for(var i=rest.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=rest[i];rest[i]=rest[j];rest[j]=t;}
  o.star=rest[0]||D[0];
  return o;
}

// 页面渲染
function rdr(){
  var t=new Date();t.setDate(t.getDate()+1);
  cr=daily(t);cs=cr.star;
  // 构建卡片
  var h='';
  var cls=['b0','b1','b2','b3'];
  meals.forEach(function(m,i){
    var d=cr[m];if(!d)return;
    h+='<div class="cd '+cls[i]+'" onclick="det('+d.id+')">';
    h+='<div class="lb">'+ML[m]+'</div>';
    h+='<div class="rw"><span class="em">'+d.e+'</span><div><div class="nm">'+d.n+'</div><div class="ct">'+d.c+'</div></div></div>';
    h+='<div class="dc">'+d.d+'</div><div class="tg">';
    d.t.forEach(function(tg){h+='<span>'+tg+'</span>';});
    h+='</div></div>';
  });
  document.getElementById('cards').innerHTML=h;
  // 主打星
  var s=cr.star;
  document.getElementById('star').innerHTML=s?
    '<div class="sr" onclick="det('+s.id+')"><span class="em">'+s.e+'</span><div style="flex:1"><div class="nm">'+s.n+'</div><div class="ct">'+s.c+'</div><div class="dc">'+s.d+'</div></div><span style="font-size:24px;color:#CCC;">›</span></div>':'';
  // 更新标题
  document.getElementById('t1').textContent='🍲 明天吃啥？('+D.length+'道)';
}

// 随机换一批
function rnd(){
  var arr=D.slice().sort(function(){return Math.random()-0.5;});
  var bm={};meals.forEach(function(m){bm[m]=[];});
  arr.forEach(function(d){if(bm[d.m].length<1)bm[d.m].push(d);});
  var used={},o={};
  meals.forEach(function(m){
    var pick=bm[m][0]||arr.find(function(d){return d.m===m&&!used[d.id];});
    if(pick){used[pick.id]=1;o[m]=pick;}
  });
  o.star=arr.find(function(d){return !used[d.id];})||arr[0];
  cr=o;cs=o.star;
  rdr();
}

// 日期
function dtStr(){
  var t=new Date();t.setDate(t.getDate()+1);
  var wd=['日','一','二','三','四','五','六'];
  document.getElementById('t2').textContent=t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日 星期'+wd[t.getDay()];
}

// 切换 tab
function go(n){
  document.getElementById('btn0').className=n===0?'on':'';
  document.getElementById('btn1').className=n===1?'on':'';
  document.getElementById('p0').style.display=n===0?'':'none';
  document.getElementById('p1').style.display=n===1?'':'none';
  if(n===1)mkBrowse();
}

// 图鉴页
function mkBrowse(){
  var h='';
  CS.forEach(function(c){h+='<span class="'+(ac===c.n?'on':'')+'" onclick="setCat(\''+c.n+'\')">'+c.e+' '+c.n+'</span>';});
  document.getElementById('cats').innerHTML=h;
  flt();
}
function setCat(c){ac=c;mkBrowse();}
function flt(){
  var kw=(document.getElementById('kw').value||'').trim().toLowerCase();
  document.getElementById('clr').style.display=kw?'inline':'none';
  var l=D.slice();
  if(ac!=='全部')l=l.filter(function(d){return d.c===ac;});
  if(kw)l=l.filter(function(d){return d.n.indexOf(kw)>=0||d.c.indexOf(kw)>=0||d.t.join('').indexOf(kw)>=0;});
  var h='';
  if(l.length===0){
    h='<div class="emp">🍽️ 没有找到</div>';
  }else{
    l.forEach(function(d){
      h+='<div class="it" onclick="det('+d.id+')"><div class="ic">'+d.e+'</div><div style="flex:1;min-width:0"><div class="nm">'+d.n+'</div><div class="mt"><span style="color:#E85D3F">'+d.c+'</span> '+ML[d.m]+'</div><div class="dc">'+d.d+'</div></div><span style="font-size:20px;color:#CCC;">›</span></div>';
    });
  }
  document.getElementById('list').innerHTML=h;
}

// 详情弹窗
function det(id){
  var d=D.find(function(x){return x.id===id;});if(!d)return;
  document.getElementById('mdl').className='mdl on';
  var h='<button class="cl" onclick="cls()">✕</button>';
  h+='<span class="em">'+d.e+'</span><h3>'+d.n+'</h3>';
  h+='<div class="bd"><span class="cc">'+d.c+'</span><span class="mm">'+ML[d.m]+'</span></div>';
  h+='<div class="ds">'+d.d+'</div>';
  h+='<div class="lb2">🏷️ 标签</div><div class="ts">';
  d.t.forEach(function(t){h+='<span>'+t+'</span>';});
  h+='</div><div class="lb2">🍵 搭配建议</div>';
  h+='<div class="pr">🍵 配一壶功夫茶，解腻回甘</div>';
  h+='<div class="pr">🍚 搭配白粥或米饭，地道吃法</div>';
  h+='<div class="pr">🥢 蘸普宁豆酱或鱼露，提鲜增味</div>';
  document.getElementById('mi').innerHTML=h;
}
function cls(){document.getElementById('mdl').className='mdl';}

// ===== 启动 =====
dtStr();
rdr();

setTimeout(function(){
  var x=new XMLHttpRequest();
  x.open('GET','https://qq2793310956-sketch.github.io/chaoshan-foodx/dishes.json?v=7',true);
  x.timeout=5000;
  x.onload=function(){
    if(x.status===200){
      try{
        var rmt=JSON.parse(x.responseText);
        if(rmt&&rmt.length>0){
          D=rmt;D.forEach(function(d,i){if(!d.id)d.id=i+1;});
          rdr();
        }
      }catch(e){}
    }
  };
  x.send();
},300);
</script>
